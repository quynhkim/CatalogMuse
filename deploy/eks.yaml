apiVersion: v1
kind: Namespace
metadata:
  name: catalogmuse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalogmuse-engine
  namespace: catalogmuse
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::474929731385:role/catalogmuse-engine
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalogmuse-engine
  namespace: catalogmuse
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogmuse-engine
  namespace: catalogmuse
  labels:
    app: catalogmuse-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalogmuse-engine
  template:
    metadata:
      labels:
        app: catalogmuse-engine
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      serviceAccountName: catalogmuse-engine
      securityContext:
        fsGroup: 1000
      containers:
        - name: catalogmuse-engine
          image: 474929731385.dkr.ecr.us-east-2.amazonaws.com/catalogmuse-engine:arm64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8790
          envFrom:
            - secretRef:
                name: catalogmuse-engine
          env:
            - name: CATALOGMUSE_HOST
              value: 0.0.0.0
            - name: CATALOGMUSE_PORT
              value: "8790"
            - name: CATALOGMUSE_DATA
              value: /data
            - name: CATALOGMUSE_PUBLIC_URL
              value: http://catalogmuse-engine.catalogmuse.svc.cluster.local:8790
            - name: CATALOGMUSE_S3_BUCKET
              value: asinzen-catalogmuse
            - name: AWS_REGION
              value: us-east-2
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalogmuse-engine
---
apiVersion: v1
kind: Service
metadata:
  name: catalogmuse-engine
  namespace: catalogmuse
  labels:
    app: catalogmuse-engine
spec:
  selector:
    app: catalogmuse-engine
  ports:
    - name: http
      port: 8790
      targetPort: http
