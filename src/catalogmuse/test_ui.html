<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CatalogMuse test</title>
  <style>
    :root { color-scheme: light; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --bg: #fafaf9; --card: #fff; --blue: #1d4ed8; --green: #15803d; --amber: #b45309; --red: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    header { padding: 16px 20px 0; }
    h1 { margin: 0; font-size: 20px; }
    .drop { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; padding: 16px 20px 28px; align-items: start; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    form, section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 10px; }
    input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; color: var(--ink); background: #fff; }
    textarea { min-height: 140px; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
    button.go { background: var(--blue); color: white; }
    button.ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    button.ok { background: var(--green); color: white; }
    button.warn { background: #fff; color: var(--amber); border: 1px solid #fdba74; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .err { color: var(--red); font-size: 13px; min-height: 1.2em; }
    .status { margin: 0 0 12px; font-size: 14px; }
    .agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .agents li { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .agents strong { font-size: 13px; }
    .state { font-size: 12px; font-weight: 650; text-transform: lowercase; }
    .state.pending { color: var(--muted); }
    .state.running { color: var(--blue); }
    .state.waiting { color: var(--amber); }
    .state.approved { color: var(--green); }
    .state.changes_requested, .state.failed { color: var(--red); }
    .detail { color: var(--muted); font-size: 12px; }
    .output { margin-top: 12px; }
    #review { margin-top: 12px; padding: 12px; border: 1px solid #fcd34d; border-radius: 10px; background: #fffbeb; }
    .prompt { margin: 4px 0 0; font-size: 18px; line-height: 1.4; }
    .style { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; margin-top: 10px; }
    .style textarea { grid-column: 1 / -1; min-height: 64px; }
    .bar { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-top: 12px; }
    .bar label { margin-top: 0; }
    .bar select { width: auto; min-width: 72px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 6px 0 12px; }
    .gallery figure { margin: 0; }
    .gallery img { width: 100%; display: block; }
    .pick { display: block; cursor: pointer; }
    .pick input { margin: 0 0 4px; }
    .output img { max-width: 100%; border-radius: 10px; background: #f5f5f4; }
    .output h2 { margin: 12px 0 6px; font-size: 16px; }
    ul.bullets { margin: 0; padding-left: 18px; }
    .empty { color: var(--muted); }
    #decision { margin-top: 12px; }
    .markets { border: 0; margin: 10px 0 0; padding: 0; }
    .markets legend { font-size: 12px; color: var(--muted); }
    .markets label { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; color: var(--ink); }
    .markets input { width: auto; }
  </style>
</head>
<body>
<header>
  <h1>CatalogMuse test</h1>
  <p class="drop">Test screen. Drop this when the React app is ready.</p>
</header>
<main>
  <form id="start">
    <label>Supplier photo
      <input id="file" type="file" accept="image/*">
    </label>
    <label>Spec sheet
      <textarea id="spec" placeholder="Stainless steel garlic press&#10;Brand: North Kitchen&#10;Material: 18/8 stainless steel&#10;Size: 7.5 inches"></textarea>
    </label>
    <fieldset class="markets">
      <legend>Marketplaces</legend>
      <label><input id="amazon" type="checkbox" checked> Amazon</label>
      <label><input id="walmart" type="checkbox"> Walmart</label>
    </fieldset>
    <div class="row">
      <button class="ghost" id="sample" type="button">Sample</button>
      <button class="go" type="submit">Start job</button>
    </div>
    <p class="err" id="error"></p>
  </form>
  <section>
    <p class="status" id="status">No job yet.</p>
    <ol class="agents" id="agents"></ol>
    <div class="output" id="output"></div>
    <div id="review" hidden></div>
    <form id="decision" hidden>
      <label id="note-label">Note for the agent
        <textarea id="note" placeholder="What should this step change?"></textarea>
      </label>
      <div class="row">
        <button class="ok" id="approve" type="submit">Approve</button>
        <button class="warn" id="changes" type="button">Request changes</button>
      </div>
      <p class="detail" id="gate"></p>
    </form>
  </section>
</main>

const NAMES = {segment:"Segment", art_director:"Art director", scene:"Scene", copy:"Copywriter", rules:"Auditor"};
let jobId = "";
let source = null;
let imageData = "";
let styleKey = "";
let imageKey = "";
let ruleKey = "";
let hideSceneGallery = false;

function styleList(output) {
  if (!output) return [];
  if (Array.isArray(output.styles) && output.styles.length) return output.styles.map(item => String(item));
  return output.prompt ? [String(output.prompt)] : [];
}

function sceneChoice() {
  const styles = [];
  document.querySelectorAll("#styles .style").forEach(row => {
    const box = row.querySelector("input");
    const text = row.querySelector("textarea");
    if (box && box.checked && text && text.value.trim()) styles.push(text.value.trim());
  });
  const count = Number(document.getElementById("variations") && document.getElementById("variations").value);
  return {styles, variations: count >= 1 && count <= 4 ? count : 1};
}

function updateImageCount() {
  const line = document.getElementById("image-count");
  if (!line) return;
  const choice = sceneChoice();
  const total = choice.styles.length * choice.variations;
  line.textContent = total
    ? "Scene makes " + total + " images, one at a time. Up to 4 per style."
    : "Select at least one style. Up to 4 images per style.";
  const add = document.getElementById("add-style");
  if (add) add.disabled = document.querySelectorAll("#styles .style").length >= 8;
}

function addStyle() {
  const list = document.getElementById("styles");
  if (!list || list.querySelectorAll(".style").length >= 8) return;
  const row = document.createElement("label");
  row.className = "style";
  row.innerHTML = `<input type="checkbox" checked><span>Style ${list.querySelectorAll(".style").length + 1}</span><textarea placeholder="Your scene, ending with 16:9."></textarea>`;
  list.appendChild(row);
  const box = row.querySelector("input");
  const text = row.querySelector("textarea");
  if (box) box.onchange = updateImageCount;
  if (text) text.oninput = updateImageCount;
  updateImageCount();
}

function bindStyles() {
  document.querySelectorAll("#styles .style").forEach(row => {
    const box = row.querySelector("input");
    const text = row.querySelector("textarea");
    if (box) box.onchange = updateImageCount;
    if (text) text.oninput = updateImageCount;
  });
  const count = document.getElementById("variations");
  if (count) count.onchange = updateImageCount;
  const add = document.getElementById("add-style");
  if (add) add.onclick = addStyle;
  updateImageCount();
}

function styleForm(styles, variations) {
  const count = variations >= 1 && variations <= 4 ? variations : 4;
  const options = [1, 2, 3, 4].map(value => `<option value="${value}"${value === count ? " selected" : ""}>${value}</option>`).join("");
  return `<p class="detail">Choose scene styles</p><div id="styles">` + styles.map((text, index) => `
    <label class="style">
      <input type="checkbox" checked>
      <span>Style ${index + 1}</span>
      <textarea>${esc(text)}</textarea>
    </label>`).join("") + `</div>
    <div class="bar">
      <button class="ghost" id="add-style" type="button">Add a style</button>
      <label>Images per style
        <select id="variations">${options}</select>
      </label>
    </div>
    <p class="detail" id="image-count"></p>`;
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
}

document.getElementById("sample").onclick = () => {
  document.getElementById("spec").value = SAMPLE_SPEC;
  imageData = SAMPLE_PHOTO;
  document.getElementById("error").textContent = "Sample spec and supplier photo loaded. The copywriter uses Muse Spark. Each scene image uses Muse Image.";
};

document.getElementById("file").onchange = () => {
  const file = document.getElementById("file").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { imageData = String(reader.result).split(",")[1] || ""; };
  reader.readAsDataURL(file);
};

document.getElementById("start").onsubmit = async (event) => {
  event.preventDefault();
  document.getElementById("error").textContent = "";
  const spec = document.getElementById("spec").value.trim();
  const marketplaces = ["amazon", "walmart"].filter(name => document.getElementById(name).checked);
  if (!spec || !imageData) {
    document.getElementById("error").textContent = "Choose a photo, or load the sample, and enter a spec.";
    return;
  }
  if (!marketplaces.length) {
    document.getElementById("error").textContent = "Choose Amazon, Walmart, or both.";
    return;
  }
  let response;
  try {
    response = await fetch("/v1/jobs", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({spec, image_base64: imageData, marketplaces}),
    });
  } catch (err) {
    document.getElementById("error").textContent = "The engine is not running. Open http://127.0.0.1:8790/.";
    return;
  }
  const payload = await response.json();
  if (!response.ok) {
    document.getElementById("error").textContent = payload.error || "The job did not start.";
    return;
  }
  watch(payload.id);
};

const openJob = new URLSearchParams(location.search).get("job");
if (openJob) watch(openJob);

function watch(id) {
  jobId = id;
  if (source) source.close();
  source = new EventSource("/v1/jobs/" + id + "/events");
  source.addEventListener("status", (event) => render(JSON.parse(event.data)));
  source.addEventListener("error", (event) => {
    if (!event.data) return;
    const payload = JSON.parse(event.data);
    document.getElementById("error").textContent = payload.error || "The status stream stopped.";
  });
}

function render(job) {
  const status = document.getElementById("status");
  const pending = job.pending_agent === "rules"
    ? "the listing"
    : (job.pending_agent ? NAMES[job.pending_agent] || job.pending_agent : "");
  status.textContent = job.status === "waiting"
    ? job.id + " is waiting on " + pending + "."
    : job.id + " is " + job.status + (job.error ? ". " + job.error : ".");
  document.getElementById("agents").innerHTML = (job.agents || []).map(agent => `
    <li>
      <strong>${esc(NAMES[agent.name] || agent.name)}</strong>
      <div>
        <div class="state ${esc(agent.state)}">${esc(agent.state.replaceAll("_", " "))}</div>
        <div class="detail">${esc(agentDetail(agent))}</div>
      </div>
    </li>`).join("");
  const sceneAgent = (job.agents || []).find(agent => agent.name === "scene");
  const sceneImages = sceneAgent && sceneAgent.output && Array.isArray(sceneAgent.output.images) ? sceneAgent.output.images : [];
  const choosing = job.status === "waiting" && job.pending_agent === "scene" && sceneImages.length > 0;
  hideSceneGallery = choosing;
  document.getElementById("output").innerHTML = (job.agents || []).map(renderOutput).join("");
  const director = (job.agents || []).find(agent => agent.name === "art_director");
  const styles = styleList(director && director.output);
  const review = document.getElementById("review");
  const reviewing = job.status === "waiting" && job.pending_agent === "art_director" && styles.length;
  if (choosing) {
    styleKey = "";
    const key = JSON.stringify(sceneImages.map(image => image.file || ""));
    if (key !== imageKey) {
      imageKey = key;
      review.hidden = false;
      review.innerHTML = imageForm(sceneImages);
    }
  } else if (job.pending_agent === "rules") {
    imageKey = "";
    styleKey = "";
    const rulesAgent = (job.agents || []).find(agent => agent.name === "rules");
    const key = JSON.stringify(rulesAgent && rulesAgent.output || {});
    if (key !== ruleKey) {
      ruleKey = key;
      review.hidden = false;
      review.innerHTML = ruleList(rulesAgent && rulesAgent.output);
    }
  } else if (!reviewing) {
    imageKey = "";
    styleKey = "";
    ruleKey = "";
    const summary = chosenCopy(director && director.output);
    review.hidden = !summary;
    review.innerHTML = summary;
  } else {
    imageKey = "";
    const key = JSON.stringify(styles);
    if (key !== styleKey) {
      styleKey = key;
      review.hidden = false;
      const suggested = director && director.output ? Number(director.output.variations) : 4;
      review.innerHTML = styleForm(styles, suggested);
      bindStyles();
    }
  }
  const decision = document.getElementById("decision");
  const waiting = job.status === "waiting";
  decision.hidden = !waiting;
  const approve = document.getElementById("approve");
  approve.disabled = !waiting || !job.approve_allowed;
  approve.textContent = reviewing ? "Generate scenes" : choosing ? "Choose images" : "Approve";
  document.getElementById("note-label").hidden = false;
  document.getElementById("changes").hidden = false;
  document.getElementById("gate").textContent = waiting && job.pending_agent === "rules" && job.approve_allowed
    ? "One approval covers the listing and the rule list."
    : waiting && !job.approve_allowed
    ? "The rule list is not clear. Request a change instead of approving."
    : choosing
      ? "Choose the images to keep. A note recuts the product and waits for approval."
    : waiting && job.pending_agent === "segment"
      ? "The note is the phrase SAM searches for. Separate pieces in the photo, such as a straw or a cable, are cut out and added."
      : "";
}

function agentDetail(agent) {
  const output = agent.output || {};
  if (agent.name === "scene" && agent.state === "running" && agent.detail) return agent.detail;
  if (agent.name === "segment" && (output.concept || output.model)) return output.concept || output.model;
  if (agent.name === "scene" && Array.isArray(output.selected) && output.selected.length) {
    return output.selected.length + (output.selected.length === 1 ? " image chosen" : " images chosen");
  }
  if (agent.name === "scene" && Array.isArray(output.images) && output.images.length) return output.images.length + " images";
  if (agent.name === "art_director" && output.concept && !Array.isArray(output.styles)) return output.concept;
  if (agent.name === "art_director" && Array.isArray(output.selected) && output.selected.length) {
    const count = output.variations || 1;
    return output.selected.length + " styles, " + count + " each";
  }
  if (agent.detail) return agent.detail;
  if (agent.name === "art_director" && output.prompt) return output.prompt;
  return "";
}

function chosenCopy(output) {
  if (!output) return "";
  const selected = Array.isArray(output.selected) ? output.selected.filter(Boolean) : [];
  if (!selected.length) {
    return output.prompt ? `<p class="detail">Scene prompt</p><p class="prompt">${esc(output.prompt)}</p>` : "";
  }
  const count = output.variations || 1;
  return `<p class="detail">Scene prompts</p>` + selected.map(text => `<p class="prompt">${esc(text)}</p>`).join("")
    + `<p class="detail">${selected.length} styles, ${count} image${count === 1 ? "" : "s"} each. They run one at a time.</p>`;
}

function renderOutput(agent) {
  const output = agent.output;
  if (!output) return "";
  if (hideSceneGallery && agent.name === "scene") return "";
  if (Array.isArray(output.images) && output.images.length) {
    const chosen = Array.isArray(output.selected) ? output.selected : [];
    const shown = chosen.length ? output.images.filter(image => chosen.includes(image.file)) : output.images;
    return renderImages(shown.length ? shown : output.images);
  }
  if (output.url) {
    const caption = agent.name === "segment"
      ? ["Searched for " + (output.concept || "the product"), output.feedback ? "Note: " + output.feedback : ""].filter(Boolean).join(". ")
      : (output.background || output.model || "");
    const src = freshUrl(output.url, (output.concept || "") + (output.feedback || ""));
    return `<div class="output"><img src="${esc(src)}" alt="${esc(agent.name)}"><p class="detail">${esc(caption)}</p></div>`;
  }
  if (output.prompt && agent.name !== "art_director") {
    return `<div class="output"><p>${esc(output.prompt)}</p><p class="detail">${esc(output.model || "")}</p></div>`;
  }
  if (output.title || output.walmart) {
    let html = "";
    if (output.title) html += listingBlock(output.title, output.bullets, output.description, "Amazon");
    if (output.walmart) {
      html += listingBlock(output.walmart.title, output.walmart.bullets, output.walmart.shelf_description, "Walmart");
    }
    return html;
  }
  if (Array.isArray(output)) {
    return `<div class="output">${output.map(item => `<p><strong>${esc(item.title || item.source)}</strong></p>`).join("")}</div>`;
  }
  if (agent.name === "rules" && Array.isArray(output.violations) && agent.state !== "changes_requested") {
    return ruleList(output);
  }
  return "";
}

function ruleList(output) {
  const markets = [["Amazon", output && output.amazon], ["Walmart", output && output.walmart]].filter(([, item]) => item);
  const sections = markets.length
    ? markets.map(([name, item]) => ruleSection(name, item.violations || [])).join("")
    : ruleSection("", (output && output.violations) || []);
  return `<div class="output"><h2>Rule list</h2>${sections}</div>`;
}

function ruleSection(name, violations) {
  const heading = name ? `<p class="detail">${esc(name)}</p>` : "";
  const lines = violations.length
    ? violations.map(item => `<li>${esc(item)}</li>`).join("")
    : "<li>Clear.</li>";
  return `${heading}<ul class="bullets">${lines}</ul>`;
}

function freshUrl(url, token) {
  if (!url || url.indexOf("X-Amz-") !== -1) return url || "";
  const join = url.indexOf("?") === -1 ? "?" : "&";
  return url + join + "v=" + encodeURIComponent(token || "1");
}

function listingBlock(title, bullets, description, heading) {
  const items = (bullets || []).map(item => `<li>${esc(item)}</li>`).join("");
  const body = description ? `<p>${esc(description)}</p>` : "";
  const name = heading ? `<p class="detail">${esc(heading)}</p>` : "";
  return `<div class="output">${name}<h2>${esc(title || "")}</h2>${body}<ul class="bullets">${items}</ul></div>`;
}

function imageForm(images) {
  const groups = [];
  images.forEach(image => {
    const prompt = image.prompt || "";
    const last = groups[groups.length - 1];
    if (!last || last.prompt !== prompt) groups.push({prompt, items: []});
    groups[groups.length - 1].items.push(image);
  });
  return `<p class="detail">Choose images</p><div id="picks">` + groups.map(group => `
    <p class="detail">${esc(group.prompt)}</p>
    <div class="gallery">` + group.items.map(image => `
      <figure>
        <label class="pick">
          <input type="checkbox" value="${esc(image.file || "")}" checked>
          <img src="${esc(image.url || "")}" alt="Image ${esc(image.variation || "")}">
          <span class="detail">Image ${esc(image.variation || "")}</span>
        </label>
      </figure>`).join("") + `</div>`).join("") + `</div>`;
}

function imageChoice() {
  return [...document.querySelectorAll("#picks input:checked")].map(input => input.value).filter(Boolean);
}

function renderImages(images) {
  const groups = [];
  images.forEach(image => {
    const prompt = image.prompt || "";
    const last = groups[groups.length - 1];
    if (!last || last.prompt !== prompt) groups.push({prompt, items: []});
    groups[groups.length - 1].items.push(image);
  });
  return `<div class="output">` + groups.map(group => `
    <p class="detail">${esc(group.prompt)}</p>
    <div class="gallery">` + group.items.map(image => `
      <figure>
        <img src="${esc(image.url || "")}" alt="Image ${esc(image.variation || "")}">
        <figcaption class="detail">Image ${esc(image.variation || "")}</figcaption>
      </figure>`).join("") + `</div>`).join("") + `</div>`;
}

document.getElementById("decision").onsubmit = (event) => {
  event.preventDefault();
  if (document.getElementById("picks")) {
    const images = imageChoice();
    if (!images.length) {
      document.getElementById("error").textContent = "Select at least one image.";
      return;
    }
    sendDecision("approve", "", {images});
    return;
  }
  if (document.getElementById("styles")) {
    const choice = sceneChoice();
    if (!choice.styles.length) {
      document.getElementById("error").textContent = "Select at least one style.";
      return;
    }
    sendDecision("approve", "", choice);
    return;
  }
  sendDecision("approve", "");
};

document.getElementById("changes").onclick = () => {
  const note = document.getElementById("note").value.trim();
  if (!note) {
    document.getElementById("error").textContent = "Write a note before requesting changes.";
    return;
  }
  sendDecision("changes", note);
};

async function sendDecision(action, note, scene) {
  document.getElementById("error").textContent = "";
  const body = {action, note};
  if (scene && scene.images && scene.images.length) body.images = scene.images;
  if (scene && scene.styles && scene.styles.length) {
    body.styles = scene.styles;
    body.variations = scene.variations;
    body.prompt = scene.styles[0];
  } else if (scene && scene.concept) {
    body.prompt = scene.concept;
  }
  const response = await fetch("/v1/jobs/" + jobId + "/decisions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const payload = await response.json();
  if (!response.ok) {
    document.getElementById("error").textContent = payload.error || "The decision was not accepted.";
    return;
  }
  if (action === "changes") document.getElementById("note").value = "";
  render(payload);
}
</script>
</body>
</html>
