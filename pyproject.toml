[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogmuse-engine"
version = "0.1.0"
description = "CatalogMuse engine. A Go backend calls this over HTTP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2",
  "pillow>=10",
  "meta-sam-parser>=0.0.6",
  "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
catalogmuse-engine = "catalogmuse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
