$kind: http-request
name: Change scene styles
method: POST
url: '{{base_url}}/v1/jobs/{{job_id}}/decisions'
order: 4000
description: Sends the note back to the art director, which rewrites the styles.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "action": "changes",
      "agent": "art_director",
      "note": "Use a desk, not a kitchen."
    }
