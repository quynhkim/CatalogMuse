$kind: http-request
name: Choose scene images
method: POST
url: '{{base_url}}/v1/jobs/{{job_id}}/decisions'
order: 5000
description: >-
  Use when pending_agent is scene. images are file names from the scene
  output, such as hero-1-1.jpg. Omit images to keep every image. A changes
  note is rejected.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "action": "approve",
      "agent": "scene",
      "images": ["hero-1-1.jpg", "hero-2-1.jpg"]
    }
examples: './.resources/Choose scene images.resources/examples'
