$kind: http-request
name: Change cutout noun
method: POST
url: '{{base_url}}/v1/jobs/{{job_id}}/decisions'
order: 2000
description: >-
  The note is the phrase SAM searches for, at whatever length the reviewer
  writes. "black tumbler" is used as written. A sentence is turned into that
  object. A period at the end is ignored. If SAM cannot find the named object,
  the step fails instead of restoring the previous cutout.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "action": "changes",
      "agent": "segment",
      "note": "headphones"
    }
