$kind: http-request
name: Approve listing
method: POST
url: '{{base_url}}/v1/jobs/{{job_id}}/decisions'
order: 6000
description: Use when pending_agent is rules and approve_allowed is true. This one approval covers the copywriter and the auditor. A non-empty violations list returns 409. There is no separate copy approval.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "action": "approve",
      "agent": "rules"
    }
examples: './.resources/Approve listing copy.resources/examples'
