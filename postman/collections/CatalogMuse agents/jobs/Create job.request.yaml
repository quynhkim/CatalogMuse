$kind: http-request
name: Create job
method: POST
url: '{{base_url}}/v1/jobs'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "spec": "Stainless steel garlic press\nBrand: North Kitchen\nMaterial: 18/8 stainless steel\nSize: 7.5 inches",
      "marketplaces": ["amazon", "walmart"],
      "image_base64": "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const body = pm.response.json();
      if (body && body.id) {
        pm.collectionVariables.set("job_id", body.id);
      }
examples: './.resources/Create job.resources/examples'
