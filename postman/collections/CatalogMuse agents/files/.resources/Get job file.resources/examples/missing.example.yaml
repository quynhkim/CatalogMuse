$kind: http-example
name: File not found
order: 1000
request:
  url: 'http://127.0.0.1:8790/v1/jobs/job_example/files/missing.jpg'
  method: GET
response:
  statusCode: 404
  statusText: Not Found
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": "File not found"
      }
