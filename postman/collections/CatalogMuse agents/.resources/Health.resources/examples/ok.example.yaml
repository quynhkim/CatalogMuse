$kind: http-example
name: Service is up
order: 1000
request:
  url: 'http://127.0.0.1:8790/health'
  method: GET
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "service": "catalogmuse-engine"
      }
