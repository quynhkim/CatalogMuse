$kind: http-request
name: Edit images
method: POST
url: '{{muse_base_url}}/images/edits'
order: 1000
description: >-
  Paint a product cutout (PNG) into a styled scene. images must contain a
  single PNG as a data URL. n controls how many variations to generate
  (1–4). Output is always 1792x1024 JPEG returned as b64_json.
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{model_api_key}}'
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "model": "{{image_model}}",
      "prompt": "Garlic press on an oak desk, soft morning light, 16:9.",
      "images": [
        {
          "image_url": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
        }
      ],
      "n": 2,
      "size": "1792x1024",
      "response_format": "b64_json",
      "output_format": "jpeg",
      "reasoning_strength": "low",
      "tool_enablement": {
        "enable_image_search": false,
        "enable_web_search": false,
        "enable_shell": false
      }
    }
