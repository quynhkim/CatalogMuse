$kind: http-request
name: Segment image
method: POST
url: '{{muse_base_url}}/responses'
order: 1000
description: >-
  Ask SAM 3.1 to mask a short visual noun. The engine sends a JPEG data
  URL. The concept must be non-empty and at most 80 characters. Each
  returned mask uses one_bit encoding and is local to its bounding box.
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{model_api_key}}'
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "model": "{{sam_model}}",
      "input": [
        {
          "type": "message",
          "role": "user",
          "content": [
            {
              "type": "input_text",
              "text": "garlic press"
            },
            {
              "type": "input_image",
              "image_url": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
            }
          ]
        }
      ],
      "metadata": {
        "mask_encoding": "one_bit",
        "include_confidence": "true"
      }
    }
