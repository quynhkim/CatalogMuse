$kind: http-request
name: Chat completions
method: POST
url: '{{muse_base_url}}/chat/completions'
order: 1000
description: >-
  Ask Muse Spark to generate text. Pass a plain text prompt or a multipart
  array with an image_url for vision tasks. temperature is fixed at 0.2 in
  the agent; response_format must be a JSON schema object.
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{model_api_key}}'
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "model": "{{text_model}}",
      "messages": [
        {
          "role": "user",
          "content": "Write a one-sentence product title for a stainless steel garlic press."
        }
      ],
      "temperature": 0.2,
      "response_format": {
        "type": "json_schema",
        "json_schema": {
          "name": "title",
          "schema": {
            "type": "object",
            "properties": {
              "title": { "type": "string" }
            },
            "required": ["title"],
            "additionalProperties": false
          },
          "strict": true
        }
      }
    }
